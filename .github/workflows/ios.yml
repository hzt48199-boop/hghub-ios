name: iOS unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install deps
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/ci-install.log
      - name: Build frontend
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/ci-frontend.log
      - name: Tauri iOS init
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri ios init 2>&1 | tee /tmp/ci-iosinit.log
      - name: Build unsigned .app with xcodebuild
        shell: bash
        run: |
          set -euo pipefail
          PROJ=$(ls src-tauri/gen/apple/*.xcodeproj)
          echo "project: $PROJ"
          SCHEME=$(xcodebuild -list -project "$PROJ" -json | python3 -c "import json,sys; ss=json.load(sys.stdin)['project']['schemes']; print(next((s for s in ss if s.endswith('_iOS')), ss[0]))")
          echo "scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" \
            build 2>&1 | tee /tmp/ci-xcode.log | tail -30
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphoneos/*.app)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "HGhub-1.2.0-unsigned.ipa" Payload
          ls -lh HGhub-1.2.0-unsigned.ipa
      - name: Publish logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la /tmp/ci-*.log || true
          gh release create "ci-log-${{ github.run_number }}" /tmp/ci-*.log --prerelease --title "CI logs build ${{ github.run_number }}" --notes "Failure diagnostics." || true
      - name: Publish IPA as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "ios-build-${{ github.run_number }}" HGhub-1.2.0-unsigned.ipa --prerelease --title "iOS unsigned build ${{ github.run_number }}" --notes "Unsigned IPA for SideStore sideload."
